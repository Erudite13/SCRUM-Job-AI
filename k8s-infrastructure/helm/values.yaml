# ==============================================================================
# AI Scrum Master Platform - Helm Values
# Production-grade configuration for all microservices
# ==============================================================================

# ------------------------------------------------------------------------------
# Global Settings
# ------------------------------------------------------------------------------
global:
  namespace: ai-scrum-system
  registry: enterpriseaicr.azurecr.io
  imagePullSecrets:
    - name: acr-credentials
  environment: production

# ------------------------------------------------------------------------------
# Spring Cloud Gateway
# ------------------------------------------------------------------------------
gateway:
  enabled: true
  replicaCount: 2
  image:
    repository: enterpriseaicr.azurecr.io/gateway
    tag: latest
    pullPolicy: IfNotPresent
  service:
    type: LoadBalancer
    port: 8080
    targetPort: 8080
  resources:
    requests:
      cpu: "500m"
      memory: "512Mi"
    limits:
      cpu: "1"
      memory: "1Gi"
  env:
    SPRING_PROFILES_ACTIVE: production
    SERVER_PORT: "8080"
    SPRING_CLOUD_GATEWAY_ROUTES_SPRINT_URI: http://sprint-service:8081
    SPRING_CLOUD_GATEWAY_ROUTES_AI_URI: http://ai-engine:8000
    SPRING_CLOUD_GATEWAY_ROUTES_VOICE_URI: ws://voice-engine:8001
  probes:
    liveness:
      path: /actuator/health
      port: 8080
      initialDelaySeconds: 30
      periodSeconds: 15
      timeoutSeconds: 5
      failureThreshold: 3
    readiness:
      path: /actuator/health
      port: 8080
      initialDelaySeconds: 20
      periodSeconds: 10
      timeoutSeconds: 5
      failureThreshold: 3

# ------------------------------------------------------------------------------
# Sprint Intelligence Service
# ------------------------------------------------------------------------------
sprintService:
  enabled: true
  replicaCount: 2
  image:
    repository: enterpriseaicr.azurecr.io/sprint-service
    tag: latest
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 8081
    targetPort: 8081
  resources:
    requests:
      cpu: "500m"
      memory: "512Mi"
    limits:
      cpu: "1"
      memory: "1Gi"
  database:
    host: postgresql
    port: 5432
    name: sprint_intelligence
    secretName: db-secrets
    secretKey: connection-string
  env:
    SPRING_PROFILES_ACTIVE: production
    SERVER_PORT: "8081"
  probes:
    liveness:
      path: /actuator/health
      port: 8081
      initialDelaySeconds: 45
      periodSeconds: 15
      timeoutSeconds: 5
      failureThreshold: 3
    readiness:
      path: /actuator/health
      port: 8081
      initialDelaySeconds: 30
      periodSeconds: 10
      timeoutSeconds: 5
      failureThreshold: 3

# ------------------------------------------------------------------------------
# AI Engine (FastAPI)
# ------------------------------------------------------------------------------
aiEngine:
  enabled: true
  replicaCount: 3
  image:
    repository: enterpriseaicr.azurecr.io/ai-engine
    tag: latest
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 8000
    targetPort: 8000
  resources:
    requests:
      cpu: "1"
      memory: "2Gi"
    limits:
      cpu: "2"
      memory: "4Gi"
  env:
    PYTHONUNBUFFERED: "1"
    LOG_LEVEL: info
  probes:
    liveness:
      path: /healthz
      port: 8000
      initialDelaySeconds: 20
      periodSeconds: 20
      timeoutSeconds: 5
      failureThreshold: 3
    readiness:
      path: /healthz
      port: 8000
      initialDelaySeconds: 15
      periodSeconds: 10
      timeoutSeconds: 5
      failureThreshold: 3
  hpa:
    enabled: true
    minReplicas: 3
    maxReplicas: 10
    targetCPUUtilizationPercentage: 75
  pdb:
    enabled: true
    minAvailable: 2

# ------------------------------------------------------------------------------
# DSM Voice Engine
# ------------------------------------------------------------------------------
voiceEngine:
  enabled: true
  replicaCount: 2
  image:
    repository: enterpriseaicr.azurecr.io/voice-engine
    tag: latest
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 8001
    targetPort: 8001
  resources:
    requests:
      cpu: "250m"
      memory: "256Mi"
    limits:
      cpu: "500m"
      memory: "512Mi"
  env:
    PYTHONUNBUFFERED: "1"
  probes:
    liveness:
      tcpSocket:
        port: 8001
      initialDelaySeconds: 15
      periodSeconds: 20
      timeoutSeconds: 5
      failureThreshold: 3
    readiness:
      tcpSocket:
        port: 8001
      initialDelaySeconds: 10
      periodSeconds: 10
      timeoutSeconds: 5
      failureThreshold: 3

# ------------------------------------------------------------------------------
# Frontend (Nginx)
# ------------------------------------------------------------------------------
frontend:
  enabled: true
  replicaCount: 2
  image:
    repository: enterpriseaicr.azurecr.io/frontend
    tag: latest
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 80
    targetPort: 80
  resources:
    requests:
      cpu: "100m"
      memory: "128Mi"
    limits:
      cpu: "250m"
      memory: "256Mi"

# ------------------------------------------------------------------------------
# PostgreSQL (with pgvector)
# ------------------------------------------------------------------------------
postgresql:
  enabled: true
  image:
    repository: pgvector/pgvector
    tag: pg16
    pullPolicy: IfNotPresent
  auth:
    postgresPassword: ""       # Set via secret
    database: sprint_intelligence
    secretName: db-secrets
  storage:
    size: 20Gi
    storageClass: managed-premium
  service:
    port: 5432
  pgvectorEnabled: true
  resources:
    requests:
      cpu: "500m"
      memory: "1Gi"
    limits:
      cpu: "2"
      memory: "4Gi"

# ------------------------------------------------------------------------------
# Ingress
# ------------------------------------------------------------------------------
ingress:
  enabled: true
  className: nginx
  host: ai-scrum.enterprise.com
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/use-regex: "true"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-connect-timeout: "60"
    nginx.ingress.kubernetes.io/websocket-services: "voice-engine"
    cert-manager.io/cluster-issuer: letsencrypt-prod
  tls:
    enabled: true
    secretName: ai-scrum-tls

# ------------------------------------------------------------------------------
# Authentication (Azure AD)
# ------------------------------------------------------------------------------
auth:
  azureTenantId: ""
  azureClientId: ""
  azureClientSecret: ""         # Set via external secret
  secretName: azure-ad-secrets

# ------------------------------------------------------------------------------
# Monitoring
# ------------------------------------------------------------------------------
monitoring:
  prometheus:
    enabled: true
    serviceMonitor:
      enabled: true
      interval: 30s
      scrapeTimeout: 10s
    rules:
      enabled: true
  grafana:
    enabled: false
    dashboards:
      enabled: true

# ------------------------------------------------------------------------------
# Network Policies
# ------------------------------------------------------------------------------
networkPolicies:
  enabled: true

# ------------------------------------------------------------------------------
# Service Account
# ------------------------------------------------------------------------------
serviceAccount:
  create: true
  name: ai-scrum-sa
  annotations: {}
