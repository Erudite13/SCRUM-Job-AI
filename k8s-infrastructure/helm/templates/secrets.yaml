apiVersion: v1
kind: Secret
metadata:
  name: db-secrets
  namespace: {{ .Values.global.namespace | default "ai-scrum-system" }}
type: Opaque
data:
  # Base64 encoded or reference Azure Key Vault CSI provider secrets
  database-password: {{ .Values.postgresql.password | default "postgres" | b64enc | quote }}
---
apiVersion: v1
kind: Secret
metadata:
  name: auth-secrets
  namespace: {{ .Values.global.namespace | default "ai-scrum-system" }}
type: Opaque
data:
  azure-ad-client-secret: {{ .Values.auth.clientSecret | default "secret" | b64enc | quote }}
---
apiVersion: v1
kind: Secret
metadata:
  name: devops-secrets
  namespace: {{ .Values.global.namespace | default "ai-scrum-system" }}
type: Opaque
data:
  azure-devops-pat: {{ .Values.sprintService.env.AZURE_DEVOPS_PAT | default "pat" | b64enc | quote }}
---
apiVersion: v1
kind: Secret
metadata:
  name: ai-secrets
  namespace: {{ .Values.global.namespace | default "ai-scrum-system" }}
type: Opaque
data:
  azure-openai-key: {{ .Values.aiEngine.env.AZURE_OPENAI_API_KEY | default "key" | b64enc | quote }}
---
apiVersion: v1
kind: Secret
metadata:
  name: voice-secrets
  namespace: {{ .Values.global.namespace | default "ai-scrum-system" }}
type: Opaque
data:
  azure-speech-key: {{ .Values.voiceEngine.env.AZURE_SPEECH_KEY | default "speechkey" | b64enc | quote }}
